# Serves skeleton pages under their real publisher hostnames, so the extractor picks each source profile.
map $host $vt_source {
    hostnames;
    default "";
    finance.yahoo.com yahoo;
    www.cnbc.com cnbc;
    www.fool.com fool;
    www.prnewswire.com prnewswire;
    www.globenewswire.com globenewswire;
    www.sec.gov sec;
    www.cnn.com cnn;
    fortune.com fortune;
    www.theguardian.com guardian;
    www.bbc.com bbc;
}

server {
    listen 80 default_server;
    server_name _;
    root /usr/share/nginx/html;
    access_log /dev/stdout;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location ~ ^/vt-skeleton/(?<slug>[a-z0-9-]+)/?$ {
        if ($vt_source = "") {
            return 404;
        }
        try_files /$vt_source/$slug.html =404;
    }

    location / {
        return 404;
    }
}
