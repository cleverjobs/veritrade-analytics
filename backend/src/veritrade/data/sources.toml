# Source registry shared by the fetcher, extractors, probe, Opus discovery and live smoke.
# `status` is set by scripts/probe_sources.py: candidate | primary | backup | rejected.
# [sources.<key>.profile] holds per-domain extraction selectors (filled from probe output).

[sources.yahoo]
name = "Yahoo Finance"
domains = ["finance.yahoo.com"]
kind = "news"
status = "candidate"

