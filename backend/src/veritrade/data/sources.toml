article_pattern = '^https://www\.benzinga\.com/(?:[a-z0-9-]+/)*\d{2}/\d{2}/\d+/[a-z0-9-]+$'

[sources.businesswire]
name = "Business Wire"
domains = ["www.businesswire.com", "businesswire.com"]
kind = "press-release"
status = "rejected"
reason = "Akamai Bot Manager: /newsroom serves an interactive challenge (HTTP 200), release pages a 403 'Page Unavailable'."
feeds = ["https://feed.businesswire.com/mrss/home/?rss=G1QFDERJXkJcFVJYWQ=="]
article_pattern = '^https://www\.businesswire\.com/news/home/\d+/en/[^/]+/$'
