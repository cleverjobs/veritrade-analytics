[tool.uv.workspace]
members = ["backend", "evals"]

[tool.uv.sources]
veritrade-backend = { workspace = true }

[dependency-groups]
dev = [
    "asgi-lifespan>=2.1",
    "mypy>=1.13",
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "pytest-cov>=6.0",
    "respx>=0.22",
    "ruff>=0.8",
]

[tool.ruff]
line-length = 110
target-version = "py313"
# The transcript is a verbatim log: its Markdown code blocks quote code as it was, never reformatted.
extend-exclude = [".temp", "frontend", ".context/transcript"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "ASYNC", "PT"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.isort]
known-first-party = ["veritrade", "veritrade_evals"]

[tool.mypy]
python_version = "3.13"
strict = true
warn_unused_ignores = true
mypy_path = ["backend/src", "evals/src"]
packages = ["veritrade", "veritrade_evals"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = [
    "trafilatura.*",
    "readability.*",
    "newspaper.*",
    "justext.*",
    "selectolax.*",
    "lxml.*",
    "bs4.*",
    "pyarrow.*",
    "huggingface_hub.*",
    "respx.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["backend/tests", "evals/tests", "scripts/tests"]
markers = ["live: hits real publisher sites (excluded by default)"]
addopts = "-m 'not live'"

[tool.coverage.run]
source = ["veritrade"]
branch = true
